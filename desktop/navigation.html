<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Player navigation</title>
  <style>
    html, body { margin: 0; background: transparent; }
    button { width: 100px; height: 44px; border: 1px solid #71717a; border-radius: 8px; background: #18181b; color: white; font: 600 15px "Segoe UI", sans-serif; cursor: pointer; }
    button:hover:enabled { background: #3f3f46; }
    button:focus-visible { outline: 2px solid #60a5fa; outline-offset: -4px; }
    button:disabled { color: #a1a1aa; cursor: default; }
  </style>
</head>
<body>
  <button id="back" type="button" disabled aria-label="Go back to the previous page">&#8592; Back</button>
  <script>
    const back = document.getElementById('back')
    back.addEventListener('click', () => window.playerNavigation.back())
    window.playerNavigation.onState(({ canGoBack }) => { back.disabled = !canGoBack })
  </script>
</body>
</html>
